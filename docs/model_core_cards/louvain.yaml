# ── Core Components ────────────────────────────────────────────────────────────

core_classes: []

core_functions:
  - name: get_louvain_partition
    file: run.py
    description: Execute Louvain algorithm via networkx
    must_preserve:
      - networkx.algorithms.community.louvain_communities call
      - resolution parameter
      - seed argument

core_pipeline_steps:
  - step: 1
    name: load_and_preprocess
    description: Load data via prepare_data_for_model (normalize, log1p, HVG, scale)

  - step: 2
    name: build_knn_graph
    description: sc.pp.neighbors on preprocessed data

  - step: 3
    name: convert_to_networkx
    description: Build NetworkX Graph from scanpy connectivities with weights

  - step: 4
    name: tune_resolution
    description: Auto-search resolution via NMI maximization (using normalized_mutual_info_score)

  - step: 5
    name: louvain_partition
    description: Run louvain_communities with best resolution

  - step: 6
    name: PCA_embedding
    description: PCA for visualization embedding

# ── Data Flow ──────────────────────────────────────────────────────────────────

core_data_flow:
  - h5ad → prepare_data_for_model → X, Y, sf, adata
  - X → sc.pp.neighbors → adjacency matrix
  - adjacency → NetworkX Graph
  - Graph + resolution → louvain_communities → community sets
  - community sets → partition dict → labels
  - X → PCA → embedding

final_output_rule:
  latent_embedding: PCA(X)
  cluster_labels: louvain_communities partition

# ── Forbidden Changes ──────────────────────────────────────────────────────────

forbidden_changes:
  - Replace networkx louvain_communities with Leiden-only
  - Skip NMI search and hard-code resolution
  - Replace Louvain with simple KMeans
  - Use ground truth labels to directly assign cluster labels

# ── Label Leakage Check ────────────────────────────────────────────────────────

label_leakage_check:
  allowed:
    - Y used in NMI search for resolution (this is auto-tuning, not direct label usage)
    - Y used for final metrics computation
  forbidden:
    - Directly assign Y as cluster labels
    - Use Y to pick individual cell assignments

