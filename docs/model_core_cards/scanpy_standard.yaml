# ── Core Components ────────────────────────────────────────────────────────────

core_classes: []

core_functions:
  - name: res_search_fixed_clus
    file: run.py
    description: Binary search for Leiden resolution parameter to match target cluster count
    must_preserve:
      - Iterate over resolution values [0.01..2.5] with increment=0.02
      - Use sc.tl.leiden for clustering
      - Return resolution giving cluster count closest to target

core_functions: []

core_pipeline_steps:
  - step: 1
    name: load_data
    function: sc.read_h5ad
    description: Load AnnData from h5ad file

  - step: 2
    name: QC
    function: sc.pp.filter_cells, sc.pp.filter_genes, sc.pp.calculate_qc_metrics
    description: Filter low-quality cells and genes

  - step: 3
    name: normalization
    function: sc.pp.normalize_total
    description: Per-cell total count normalization (target_sum=1e4)

  - step: 4
    name: log1p
    function: sc.pp.log1p
    description: log(1+x) transformation

  - step: 5
    name: HVG_selection
    function: sc.pp.highly_variable_genes
    description: Select highly variable genes (seurat flavor, n_top_genes=2000)

  - step: 6
    name: scaling (optional)
    function: sc.pp.scale
    description: Z-score standardization (disabled by default)

  - step: 7
    name: PCA
    function: sc.tl.pca
    description: Principal component analysis (svd_solver=arpack)

  - step: 8
    name: neighbors
    function: sc.pp.neighbors
    description: Build KNN graph from PCA representation

  - step: 9
    name: UMAP
    function: sc.tl.umap
    description: UMAP dimensionality reduction for visualization

  - step: 10
    name: Leiden_clustering
    function: sc.tl.leiden
    description: Leiden community detection with auto-tuned resolution

  - step: 11
    name: evaluation
    function: evaluation.py
    description: Compute clustering metrics vs ground truth

# ── Data Flow ──────────────────────────────────────────────────────────────────

core_data_flow:
  - raw h5ad
  - QC filtering → filtered adata
  - normalize_total → normalized counts
  - log1p → log-normalized
  - highly_variable_genes → HVG-subset adata
  - optional scale → Z-scored
  - PCA → X_pca (embedding)
  - neighbors → adjacency graph
  - UMAP → X_umap (visualization)
  - Leiden → cluster labels
  - eval_fn → metrics vs ground truth

final_output_rule:
  latent_embedding: adata.obsm['X_pca']
  cluster_labels: adata.obs['scanpy_leiden']

