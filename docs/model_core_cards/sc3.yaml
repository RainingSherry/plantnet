# ── Core Components ────────────────────────────────────────────────────────────

core_classes: []

core_functions:
  - name: build_consensus_matrix
    file: run.py
    description: Build consensus matrix via multiple K-means runs
    must_preserve:
      - PCA dimensionality reduction
      - Multiple K-means configurations
      - Consensus matrix accumulation
      - return (consensus_matrix, X_pca)

core_pipeline_steps:
  - step: 1
    name: load_and_preprocess
    description: Load data via prepare_data_for_model (normalize, log1p, HVG, NO scale)

  - step: 2
    name: PCA_reduction
    description: PCA on preprocessed data (n_pcs=20)

  - step: 3
    name: consensus_matrix
    description: build_consensus_matrix via multi-configuration K-means

  - step: 4
    name: final_clustering
    description: AgglomerativeClustering on distance matrix (1 - consensus)
    must_preserve:
      - metric='precomputed'
      - linkage='average'
      - fallback to KMeans if hierarchical fails

  - step: 5
    name: label_alignment
    description: Hungarian algorithm alignment with ground truth

# ── Data Flow ──────────────────────────────────────────────────────────────────

core_data_flow:
  - h5ad → prepare_data_for_model → X, Y, sf, adata
  - X → PCA(n_pcs=20) → X_pca
  - X_pca + multiple K-means → consensus matrix
  - consensus → dist_matrix (1 - consensus)
  - dist_matrix → AgglomerativeClustering → y_pred
  - y_pred + Y → linear_sum_assignment → y_pred_aligned
  - metrics computation → metrics.json

final_output_rule:
  latent_embedding: X_pca from PCA
  cluster_labels: y_pred from hierarchical clustering (aligned)

