# Model Core Card: scCDCG
# Cell-type Discovery via Clustering on Graphs

model_key: sccdcg
name: scCDCG
full_name: Cell-type Discovery via Clustering on Graphs
source_path: OtherMode/scCluBench-main/GNN/scCDCG
target_path: methods/GNN/scCDCG
category: GNN
status: VERIFIED
authenticity_status: PENDING_AUDITED
smoke_status: PASS  # Small data: ACC=0.371, NMI=0.424, ARI=0.190 (4.5s). epochs=1 path works.
framework: PyTorch
gpu_policy: "gpu=1 default (type=int); --no_cuda available"

# ── File Classification ────────────────────────────────────────────────────────

core_source_files:
  - run.py               # Entry point
  - model.py              # AE_GAT, AE_NN, ClusterAssignment
  - scCDCG_layer.py       # Custom layers
  - scCDCG_utils.py       # Utilities
  - scCDCG_preprocess.py  # Graph construction and preprocessing
  - train_scCDCG.py        # Training loop
  - __init__.py

support_files: []

adapter_files:
  - run.py

generated_or_output_files: []

# ── Core Components ────────────────────────────────────────────────────────────

core_classes:
  - name: AE_GAT
    file: model.py
    description: Graph Attention Autoencoder
    required_components:
      - Multi-head attention layers
      - Graph structure input
      - Reconstruction loss

  - name: AE_NN
    file: model.py
    description: Nearest-neighbor Autoencoder
    required_components:
      - Feedforward encoder/decoder
      - Neighborhood reconstruction

  - name: ClusterAssignment
    file: model.py
    description: Clustering layer with assignment matrix
    required_components:
      - pdf_norm: probability density normalization
      - DEC-style soft assignment

  - name: FULL_NN
    file: model.py
    description: Full model combining AE + clustering (NN version)
    required_components:
      - AE_NN encoder
      - ClusterAssignment module
      - Joint loss

core_functions:
  - name: sinkhorn
    file: run.py
    description: Sinkhorn optimal transport for clustering

  - name: pdf_norm
    file: scCDCG_utils.py
    description: Probability density normalization for clustering

core_losses:
  - name: reconstruction_loss
    formula: MSE(x_recon, x)  # from original reference
    stage: pretrain

  - name: orthogonal_loss
    formula: Encourages orthogonal cluster assignments
    stage: pretrain

  - name: covariance_loss
    formula: Encourages diverse cluster representations
    stage: pretrain

  - name: clustering_loss (DEC/Sinkhorn)
    formula: KL divergence or Sinkhorn distance
    stage: fit

# ── Training Stages ─────────────────────────────────────────────────────────────

required_training_stages:
  - name: pretrain
    order: 1
    description: AE pretraining with orthogonal + covariance losses
    evidence:
      - pretrain() method defined
      - MSE + orthogonal + covariance losses

  - name: kmeans_init
    order: 2
    description: KMeans initialization of cluster centers

  - name: fit (clustering)
    order: 3
    description: DEC/Sinkhorn clustering with joint loss

# ── Data Flow ──────────────────────────────────────────────────────────────────

core_data_flow:
  - X (gene expression) → graph construction → adj matrix
  - AE_GAT/AE_NN encode → z (latent)
  - AE decode → x_recon (reconstruction)
  - ClusterAssignment(z) → soft cluster assignments
  - Joint loss: reconstruction + orthogonal + covariance + clustering

final_output_rule:
  latent_embedding: z from AE
  cluster_labels: from ClusterAssignment

# ── Label Leakage Check ────────────────────────────────────────────────────────

label_leakage_check:
  allowed:
    - Y used for final metrics computation (SOFT: eval_fn(Y, y_pred) for logging only)
  forbidden:
    - Y used for best model selection in training loop
    - ACC/NMI/ARI used for early stopping or checkpoint selection
    - acc > acc_max pattern for saving best model
  risk_factors: []
  actual_leakage_in_code: []
  verdict: |
    FIXED: run.py training loop no longer uses Y for model selection.
    ACC-based checkpoint selection removed (acc > acc_max pattern deleted).
    Now uses loss-based selection (lowest total loss = best checkpoint).
    eval_fn(Y, y_pred) still called for logging only (SOFT access).
    pretrain model saved at last epoch (no label-based selection).
    fine-tune best checkpoint selected by lowest loss (unsupervised criterion).
  status: LABEL_LEAKAGE_FIXED

# ── Forbidden Changes ──────────────────────────────────────────────────────────

forbidden_changes:
  - Remove AE branch
  - Remove attention mechanism from AE_GAT
  - Replace ClusterAssignment with simple KMeans
  - Remove Sinkhorn or DEC clustering
  - Default --gpu 0 (BDD Scenario 13 violation)
  - Use ground truth labels to select best epoch/model

# ── Required Fixes ─────────────────────────────────────────────────────────────

required_fixes:
  - "[DONE] Change --gpu default from 0 to 1 (BDD Scenario 13)"
  - "[DONE] REMOVED: audit train_scCDCG.py for label leakage (leakage confirmed in run.py)"
  - "[DONE] Verify all core losses present and used in training"
  - "[PENDING] Verify smoke test in plantnet-core environment"

# ── Migration Status ────────────────────────────────────────────────────────────

migration_blockers:
