# ── Core Components ────────────────────────────────────────────────────────────

core_classes:
  - name: scDCC
    file: scDCC.py
    description: Encoder-decoder with ZINB outputs and clustering layer
    must_preserve:
      - zinb_loss
      - soft_assign
      - target_distribution
      - cluster_loss
      - forward(

  - name: ZINBLoss
    file: layers.py
    description: Zero-Inflated Negative Binomial loss
    must_preserve:
      - torch.lgamma
      - torch.where
      - torch.pow

  - name: MeanAct
    file: layers.py
    description: Mean activation for ZINB mean parameter
    must_preserve: torch.clamp(torch.exp(x), min=1e-5, max=1e6)

  - name: DispAct
    file: layers.py
    description: Dispersion activation for ZINB dispersion parameter
    must_preserve: torch.clamp(F.softplus(x), min=1e-4, max=1e4)

core_functions:
  - name: cluster_acc
    file: scDCC.py
    signature: "def cluster_acc(y_true, y_pred)"
    description: Hungarian algorithm alignment for clustering accuracy

  - name: buildNetwork
    file: scDCC.py
    signature: "def buildNetwork(layers, type, activation)"
    description: Helper to build encoder/decoder networks

  - name: set_seed
    file: run.py
    description: Random seed initialization

core_losses:
  - name: ZINB reconstruction loss
    stage: pretrain_autoencoder
    formula: zinb_loss(x_raw, mean, disp, pi, scale_factor)
    search_patterns:
      - zinb_loss
      - ZINBLoss
    must_appear_in: pretrain_autoencoder batch loop

  - name: ZINB reconstruction loss
    stage: fit (clustering)
    formula: zinb_loss(x_raw_batch, mean_batch, disp_batch, pi_batch, sf_batch)
    search_patterns:
      - zinb_loss
      - ZINBLoss
    must_appear_in: fit batch loop (combined with cluster_loss)

  - name: cluster_loss (KL divergence)
    stage: fit (clustering)
    formula: self.cluster_loss(target_p, q_batch) = gamma * kld(p, q)
    search_patterns:
      - cluster_loss
      - kld\(p
    must_appear_in: fit batch loop (combined with ZINB loss)

  - name: total_loss
    stage: fit
    formula: cluster_loss + zinb_loss
    search_patterns:
      - total_loss
      - loss\.backward
    must_appear_in: fit batch loop with backward()

# ── Training Stages ─────────────────────────────────────────────────────────────

required_training_stages:
  - name: pretrain_autoencoder
    order: 1
    description: Autoencoder pretraining with ZINB loss
    evidence:
      - pretrain_autoencoder() method defined
      - zinb_loss called in batch loop
      - optimizer = optim.Adam on model.parameters()
      - backward() called
      - ae_weights saved

  - name: kmeans_init
    order: 2
    description: KMeans initialization of cluster centers mu
    evidence:
      - encodeBatch() used to get latent representations
      - KMeans(n_clusters, n_init=20).fit_predict(data)
      - mu.data.copy_(torch.Tensor(cluster_centers_))

  - name: fit (clustering)
    order: 3
    description: Joint ZINB + clustering loss training
    evidence:
      - fit() method defined
      - cluster_loss in batch loop
      - zinb_loss in batch loop
      - total_loss = cluster_loss + zinb_loss
      - backward() and optimizer.step() called
      - target_distribution() updated periodically

# ── Data Flow ──────────────────────────────────────────────────────────────────

core_data_flow:
  - X (log-normalized input)
  - X_raw (raw counts for ZINB, via adata.layers['norm_log'])
  - size_factor (cell-level normalization factor)
  - encoder(x + noise) → h → z_mu (_enc_mu)
  - decoder(z) → dec_h3
  - dec_h3 → _dec_mean (MeanAct), _dec_disp (DispAct), _dec_pi (Sigmoid)
  - ZINBLoss(x_raw, mean, disp, pi, sf) → pretrain/fit loss
  - soft_assign(z) → q (Student-t)
  - target_distribution(q) → p (KL target)
  - cluster_loss(p, q) → clustering loss

final_output_rule:
  latent_embedding: z from encodeBatch(X)
  cluster_labels: argmax of q from final epoch

# ── Forbidden Changes ──────────────────────────────────────────────────────────

forbidden_changes:
  - Remove ZINBLoss or replace with MSE/BCE
  - Remove _dec_mean, _dec_disp, or _dec_pi
  - Replace MeanAct/DispAct with ReLU or Sigmoid
  - Skip pretrain_autoencoder stage
  - Replace ZINB loss with ordinary MSE in pretrain
  - Remove clustering layer (mu parameter)
  - Remove soft_assign or target_distribution
  - Replace joint loss with clustering-only or reconstruction-only
  - Use ground truth labels to select best epoch
  - Replace with KMeans-only post-hoc clustering on embedding

# ── Label Leakage Check ────────────────────────────────────────────────────────

label_leakage_check:
  allowed:
    - Y used for final metrics computation
    - cluster_acc used for printing progress (not for saving best model)
  forbidden:
    - Using Y to select best epoch in fit loop
    - eval_fn(Y, ...) for early stopping or model selection
  actual_leakage_in_code:
    - "scDCC.fit() uses cluster_acc(y, self.y_pred) to track ACC/NMI/ARI during training (lines ~180-210)"
    - "acc/nmi/ari computed every epoch for progress printing, but NOT used for best model selection"
    - "No actual best-model selection based on labels — only early stopping via delta_label tolerance"
  verdict: |
    LABEL LEAKAGE EXISTS (soft): cluster_acc(y, self.y_pred) called every epoch in fit()
    but the values are only printed, not used to select the best model checkpoint.
    The training loop DOES NOT save best model by ACC/NMI — it runs for fixed epochs.
    This is a borderline case: labels are accessed but not used for optimization decisions.
    Consider this acceptable since no model selection is based on labels.
    For stricter compliance, move metric computation outside training loop.
  status: SOFT_LEAKAGE_ACCEPTABLE

