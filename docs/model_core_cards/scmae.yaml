model_key: scmae
name: scMAE
full_name: scMAE (Masked Autoencoder for Single-Cell Expression)
paper: "Masked Autoencoder for Single-Cell Expression (scMAE)"
source_path: methods/DeepLearning/scMAE
target_path: methods/DeepLearning/scMAE
category: DeepLearning
status: VERIFIED
