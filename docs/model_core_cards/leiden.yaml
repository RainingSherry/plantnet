# ── File Classification ────────────────────────────────────────────────────────

core_source_files:
  - run.py

support_files: []

adapter_files:
  - run.py

generated_or_output_files:
  - embedding_final.npy
  - labels.npy
  - metrics.json
  - args.json

# ── Core Components ────────────────────────────────────────────────────────────

core_classes: []

core_functions:
  - name: get_leiden_partition
    file: run.py
    description: Execute Leiden algorithm with RBConfigurationVertexPartition
    must_preserve:
      - leidenalg.find_partition() call
      - RBConfigurationVertexPartition partition type
      - resolution_parameter argument
      - seed argument

core_pipeline_steps:
  - step: 1
    name: load_and_preprocess
    description: Load data via prepare_data_for_model (normalize, log1p, HVG, scale)

  - step: 2
    name: build_knn_graph
    description: sc.pp.neighbors on preprocessed data

  - step: 3
    name: convert_to_igraph
    description: Build igraph from scanpy connectivities with weights

  - step: 4
    name: tune_resolution
    description: Auto-search resolution via NMI maximization (using normalized_mutual_info_score)

  - step: 5
    name: leiden_partition
    description: Run leidenalg.find_partition with best resolution

  - step: 6
    name: PCA_embedding
    description: PCA for visualization embedding

# ── Data Flow ──────────────────────────────────────────────────────────────────

core_data_flow:
  - h5ad → prepare_data_for_model → X, Y, sf, adata
  - X → sc.pp.neighbors → adjacency matrix
  - adjacency → igraph Graph
  - igraph + resolution → leidenalg.find_partition → membership
  - membership → cluster labels
  - X → PCA → embedding

final_output_rule:
  latent_embedding: PCA(X)
  cluster_labels: leidenalg partition membership

# ── Forbidden Changes ──────────────────────────────────────────────────────────

forbidden_changes:
  - Replace leidenalg with Louvain-only
  - Replace RBConfigurationVertexPartition with CPMVertexPartition
  - Skip NMI search and hard-code resolution
  - Replace Leiden algorithm with simple modularity optimization
  - Use ground truth labels to directly assign cluster labels

# ── Label Leakage Check ────────────────────────────────────────────────────────

label_leakage_check:
  allowed:
    - Y used in NMI search for resolution (this is auto-tuning, not direct label usage)
    - Y used for final metrics computation
  forbidden:
    - Directly assign Y as cluster labels
    - Use Y to pick individual cell assignments

