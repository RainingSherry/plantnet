negative_sampling_ablation_methods:
  - plantspade_lgcl_neg_random_zero
  - plantspade_lgcl_neg_idf_weighted_zero
  - plantspade_lgcl_neg_neighbor_conflict_zero
samplers:
  random_zero:
    description: Uniformly sample genes absent from the current cell.
  idf_weighted_zero:
    description: Prefer globally common genes that are absent from the current cell; despite the name, this is a high-frequency-zero stress test.
  neighbor_conflict_zero:
    description: Prefer genes expressed by similar cells but absent from the current cell.
defaults:
  negative_neighbor_k: 15
  use_support_attention: false
