traditional:
  pca_components: 50
  methods:
    - traditional_pca
  clustering:
    kmeans_known_k: true
    leiden_fixed_resolution: 1.0
    louvain_fixed_resolution: 1.0
deep:
  phytocluster:
    runner: methods/DeepLearning/PhytoCluster/run.py
    epochs_note: uses pretrain_max_iter and cluster_max_iter from current implementation
    args:
      latent_dim: 10
      pretrain_max_iter: 30000
      cluster_max_iter: 300
      batch_size: 64
      lr: 0.0001
  scvi:
    runner: methods/DeepLearning/scVI/run.py
    raw_counts_input: true
    args:
      latent_dim: 10
      n_layers: 1
      encode_dim: 128
      epochs: 200
      batch_size: 256
      lr: 0.001
  scmae:
    runner: methods/DeepLearning/scMAE/run.py
    args:
      hidden_size: 128
      mask_prob: 0.4
      epochs: 100
      eval_interval: 100
      batch_size: 256
      lr: 0.001
sc3:
  runner: methods/Traditional/sc3/run.py
  max_cells: 5000
  include_in_main: false
  skipped_reason: Use as supplementary only when cell-count limit is satisfied.
archive_excluded_from_main:
  - methods/Foundation/scGPT
  - methods/Foundation/GeneFormer
  - methods/Foundation/GeneCompass
  - methods/GNN/scCDCG
  - methods/GNN/scDSC
  - methods/GNN/scGNN
