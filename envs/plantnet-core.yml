# plantnet-core: Main environment for PyTorch + Scanpy methods
# Used as fallback when no explicit runtime is specified.
name: plantnet-core
channels:
  - pytorch
  - conda-forge
  - defaults
dependencies:
  - python=3.9
  - pytorch>=2.0
  - torchvision
  - torchaudio
  - cudatoolkit=11.8
  - scanpy>=1.9
  - anndata>=0.8
  - scipy>=1.10
  - scikit-learn>=1.3
  - pandas>=2.0
  - numpy>=1.24
  - matplotlib>=3.7
  - seaborn>=0.12
  - leidenalg>=0.1.0
  - igraph>=0.11
  - networkx>=3.1
  - h5py>=3.9
  - numba>=0.57
  - pip
  - pip:
    - torchmetrics
    - scanpy[leiden]
