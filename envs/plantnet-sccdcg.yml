# plantnet-sccdcg: scCDCG PyTorch environment
# Maps to scclubench-sccdcg conda env which has PyTorch 1.12.0 + CUDA 11.3
name: plantnet-sccdcg
channels:
  - pytorch
  - nvidia
  - defaults
dependencies:
  - python=3.8
  - pytorch=1.12.0
  - torchvision
  - torchaudio
  - cudatoolkit=11.3
  - cudnn>=8.6
  - scikit-learn>=1.2
  - scipy>=1.9
  - numpy>=1.23
  - h5py>=3.8
  - pandas>=1.5
  - pip
  - pip:
    - scanpy
    - anndata
    - torchmetrics
