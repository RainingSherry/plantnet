# Runtime Registry — Example Configuration
# ============================================================
#
# Per BDD Scenario 1.2: This file maps logical runtime names to concrete
# Python executables. The ACTUAL file (with real absolute paths) is
# envs/runtime_registry.yaml, but runtime_registry.example.yaml (without
# absolute paths) is what gets committed to GitHub.
#
# HOW TO USE:
#   1. Copy this to runtime_registry.yaml
#   2. Fill in the actual Python paths for your machine
#   3. Point run_formal_benchmark.py to it via --runtime_registry
#
# IMPORTANT: Do NOT commit runtime_registry.yaml with real paths to GitHub.
# Only commit runtime_registry.example.yaml.

runtimes:
  # ── Main environment: existing scclubench-main conda env ──────────────
  plantnet-core:
    backend: conda
    description: "Main environment — PyTorch + Scanpy + scCluBench deps (no TF)"
    python: /data/luolie/conda/envs/scclubench-main/bin/python
    env_file: envs/plantnet-core.yml
    notes: "Default fallback when no runtime is specified"

  # ── TensorFlow environment: for scDeepCluster, scNAME, scziDesk ──────
  plantnet-tf1:
    backend: conda
    description: "TensorFlow 2.x environment for scDeepCluster, scNAME, scziDesk"
    python: /data/luolie/conda/envs/scssl_bench_py310/bin/python
    env_file: envs/plantnet-tf1.yml
    notes: "scssl_bench_py310 has TF 2.15.0 + torch"

  # ── DESC: separate env due to potentially different TF version ─────────
  plantnet-desc:
    backend: conda
    description: "DESC specific environment"
    python: /data/luolie/conda/envs/scssl_bench_py310/bin/python
    env_file: envs/plantnet-desc.yml
    notes: "DESC may need specific TF versions"

  # ── scCDCG: PyTorch environment ───────────────────────────────────────
  plantnet-sccdcg:
    backend: conda
    description: "scCDCG PyTorch environment"
    python: /data/luolie/conda/envs/scclubench-sccdcg/bin/python
    env_file: envs/plantnet-sccdcg.yml
    notes: "PyTorch 1.12.0 + CUDA 11.3"

  # ── scGNN: PyTorch environment (no R/rpy2 needed for noregu mode) ────
  plantnet-scgnn:
    backend: conda
    description: "scGNN PyTorch environment (noregu/LTMG mode)"
    python: /data/luolie/conda/envs/scclubench-main/bin/python
    env_file: envs/plantnet-scgnn.yml
    notes: "Default: noregu mode (no R/rpy2). LTMG requires plantnet-scgnn-r."

  # ── scGNN with R/rpy2 for LTMG mode ─────────────────────────────────
  plantnet-scgnn-r:
    backend: conda
    description: "scGNN with R/rpy2 for LTMG regularization"
    python: /data/luolie/conda/envs/scclubench-main/bin/python
    env_file: envs/plantnet-scgnn-r.yml
    notes: "Requires R package scGNNLTMG + rpy2. Not needed for noregu mode."

  # ── AttentionAE_sc: PyTorch environment ───────────────────────────────
  plantnet-attentionae:
    backend: conda
    description: "AttentionAE_sc PyTorch environment"
    python: /data/luolie/conda/envs/scclubench-main/bin/python
    env_file: envs/plantnet-attentionae.yml
    notes: "Same core deps as plantnet-core"
