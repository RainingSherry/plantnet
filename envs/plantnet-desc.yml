# plantnet-desc: DESC-specific environment
# DESC is a TensorFlow-based deep clustering method.
name: plantnet-desc
channels:
  - nvidia
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - tensorflow>=2.13
  - keras
  - cudatoolkit=11.8
  - cudnn>=8.6
  - numpy>=1.24
  - scipy>=1.10
  - scikit-learn>=1.3
  - pandas>=2.0
  - h5py>=3.9
  - pip
  - pip:
    - scanpy
    - anndata
