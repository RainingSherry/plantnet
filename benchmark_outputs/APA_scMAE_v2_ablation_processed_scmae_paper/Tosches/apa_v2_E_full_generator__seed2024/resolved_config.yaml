method_name: apa_v2_E_full_generator
seed: 2024
skip_eval: false
runtime:
  no_cuda: false
  gpu: 3
  gpu_explicit: true
  allowed_gpus:
  - 1
  - 2
  - 3
  - 4
  - 5
  - 6
  forbidden_gpus:
  - 0
  - 7
  deterministic: true
  num_workers: 0
  fail_fast: true
  max_attention_elements: 300000000
  force_large_attention: false
preprocessing:
  input_mode: log1p
  target_sum: 10000.0
  n_top_genes: 2000
  scale_input: false
  input_mode_requested: log1p
  input_mode_resolved: log1p
  raw_count_source: null
  label_key: resolved_label
  labels_available: true
  actual_n_genes: 2000
  feature_space_source: hvg_variance
  gene_stats_source: pre_scale_log1p
prototype:
  n_prototypes: 16
  pca_dim: 32
model:
  token_dim: 64
  cell_dim: 64
  attention_heads: 4
  attention_dropout: 0.1
  dropout: 0.0
  decoder_mode: z_with_stopgrad_h
corruption:
  type: scmae_shuffle
  changed_tolerance_abs: 1.0e-06
  changed_tolerance_rel: 1.0e-05
mask:
  ratio: 0.4
  temperature: 1.0
  masked_data_weight: 0.75
  generator_topk_only_effective: true
training:
  epochs: 80
  batch_size: 16
  lr_student: 0.001
  lr_generator: 0.0001
  weight_decay: 1.0e-05
  student_grad_clip: 5.0
  generator_grad_clip: 1.0
  generator_update_interval: 1
  student_warmup_epochs: 20
  enable_generator_after_warmup: true
  gamma: 0.7
representation_loss:
  use_repr_loss: true
  lambda_invariance: 1.0
  lambda_variance: 0.1
  lambda_covariance: 0.01
  variance_margin: 1.0
  eps: 0.0001
teacher:
  use_ema_teacher: true
  teacher_momentum_start: 0.99
  teacher_momentum_end: 0.999
  teacher_consistency_weight: 1.0
prototype_consistency:
  use_proto_consistency: true
  num_embedding_prototypes: 0
  proto_temperature: 0.2
  proto_loss_weight: 0.1
  proto_balance_weight: 0.01
  proto_ema_momentum: 0.95
generator_loss:
  lambda_entropy: 0.01
  lambda_balance: 0.01
  lambda_distortion: 0.01
  lambda_coverage: 0.01
  lambda_reconstruction_moderate: 0.1
  lambda_representation_moderate: 0.1
evaluation:
  label_key: resolved_label
  n_neighbors: 15
  leiden_fixed_resolution: 1.0
data_path: /data/luolie/biopipeline/scCluBench/data/processed_scmae/Tosches.h5ad
save_dir: /home/luolie/biopipeline/dimension-reduction/plantnet/benchmark_outputs/APA_scMAE_v2_ablation_processed_scmae_paper/Tosches/apa_v2_E_full_generator__seed2024
n_clusters: 15
dataset_name: Tosches
